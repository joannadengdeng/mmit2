# Local training config for one experiment setup.
#
# Usage:
#   python -m vlmintune.training --config experiment_setup/textvqa_qwen25vl3b_mores_debug/train_config.yaml

model:
  model_path: "Qwen/Qwen2.5-VL-3B-Instruct"

experiment:
  name: "textvqa_qwen25vl3b_mores_debug"
  base_dir: "experiments"

training:
  ft_method: mores
  num_epochs: 1
  per_device_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  save_steps: 0
  output_dir: "experiments"

data:
  dataset_name: "lmms-lab/textvqa"
  max_samples: 100
