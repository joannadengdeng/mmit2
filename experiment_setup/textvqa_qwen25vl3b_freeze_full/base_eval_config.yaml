# Local eval config for the unfine-tuned base model.
#
# Usage:
#   python -m vlmintune.eval --config experiment_setup/textvqa_qwen25vl3b_freeze_full/base_eval_config.yaml

model:
  model_path: "Qwen/Qwen2.5-VL-3B-Instruct"

experiment:
  name: "textvqa_qwen25vl3b_freeze_full"
  base_dir: "experiments"

eval:
  name: "textvqa_validation_full"
  source: "base"
  dataset_name: "lmms-lab/textvqa"
  split: validation
  metric: "vqa_accuracy"
  max_samples: 0
  max_new_tokens: 16
  temperature: 0.0
