# Tiny base-model eval config for TextVQA on LLaVA-1.5.
#
# Usage:
#   python -m vlmintune.eval --config experiment_setup/textvqa_llava15_7b_lora_tiny/base_eval_config.yaml

model:
  name: "llava15_7b"

experiment:
  name: "textvqa_llava15_7b_lora_tiny"
  base_dir: "experiments"

eval:
  source: "base"
  dataset_name: "lmms-lab/textvqa"
  max_samples: 4
  max_new_tokens: 16
  temperature: 0.0
