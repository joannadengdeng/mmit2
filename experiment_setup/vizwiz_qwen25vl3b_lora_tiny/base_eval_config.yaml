# Tiny base-model eval config for VizWiz.
#
# Usage:
#   python -m vlmintune.eval --config experiment_setup/vizwiz_qwen25vl3b_lora_tiny/base_eval_config.yaml

model:
  name: "qwen25vl_3b_instruct"

experiment:
  name: "vizwiz_qwen25vl3b_lora_tiny"
  base_dir: "experiments"

eval:
  source: "base"
  dataset_name: "HuggingFaceM4/VizWiz"
  max_samples: 4
  max_new_tokens: 16
  temperature: 0.0
