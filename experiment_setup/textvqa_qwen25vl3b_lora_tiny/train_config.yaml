# Tiny LoRA smoke config for TextVQA.
#
# Usage:
#   python -m vlmintune.training --config experiment_setup/textvqa_qwen25vl3b_lora_tiny/train_config.yaml

model:
  name: "qwen25vl_3b_instruct"

experiment:
  name: "textvqa_qwen25vl3b_lora_tiny"
  base_dir: "experiments"

training:
  ft_method: lora
  num_epochs: 1
  per_device_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  save_steps: 0
  output_dir: "experiments"
  params:
    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.05
    target_modules: ["q_proj", "v_proj"]

data:
  dataset_name: "lmms-lab/textvqa"
  max_samples: 8
