# SSH training config for a debug-friendly freeze experiment.
#
# Usage:
#   python -m vlmintune.training --config experiment_setup/textvqa_qwen25vl3b_freeze_debug/train_config.yaml

runtime:
  mode: ssh
  ssh:
    port: 22
    username: "root"
    # password: ""

model:
  model_path: "Qwen/Qwen2.5-VL-3B-Instruct"

experiment:
  name: "textvqa_qwen25vl3b_freeze_debug"
  base_dir: "experiments"

training:
  ft_method: freeze
  num_epochs: 1
  per_device_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-5
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  save_steps: 0
  output_dir: "experiments"
  params:
    model_layout: "qwen2_5_vl"
    unfreeze_modules:
      - "model.language_model.layers.0"
      - "model.language_model.layers.1"
      - "model.language_model.layers.2"
      - "model.language_model.layers.3"

data:
  adapter: hf_datasets
  data_path: "lmms-lab/textvqa"
  split: train
  # Keep this small for fast smoke/debug runs. Set to 0 for the full train split.
  max_samples: 100
