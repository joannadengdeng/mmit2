# SSH eval config for the trained freeze checkpoint.
#
# Usage:
#   python -m vlmintune.eval --config experiment_setup/textvqa_qwen25vl3b_freeze_debug/eval_config.yaml

runtime:
  mode: ssh
  ssh:
    host: "192.168.1.100"
    port: 22
    username: "root"
    key_path: "~/.ssh/id_rsa"
    # password: ""
    conda_env: "mmit"

model:
  model_path: "Qwen/Qwen2.5-VL-3B-Instruct"

experiment:
  name: "textvqa_qwen25vl3b_freeze_debug"
  base_dir: "experiments"

eval:
  name: "textvqa_validation_debug20"
  dataset_name: "lmms-lab/textvqa"
  split: validation
  # Keep this small so the predictions file is easy to inspect by hand.
  max_samples: 20
  max_new_tokens: 16
  temperature: 0.0
