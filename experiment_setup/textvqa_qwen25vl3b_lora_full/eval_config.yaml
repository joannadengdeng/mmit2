# SSH eval config for the trained experiment checkpoint.
#
# Usage:
#   python -m vlmintune.eval --config experiment_setup/textvqa_qwen25vl3b_lora_full/eval_config.yaml --host 10.0.0.8

runtime:
  mode: ssh
  ssh:
    port: 22
    username: "root"
    key_path: "~/.ssh/id_rsa"
    # password: ""

model:
  model_path: "Qwen/Qwen2.5-VL-3B-Instruct"

experiment:
  name: "textvqa_qwen25vl3b_lora_full"
  base_dir: "experiments"

eval:
  dataset_name: "lmms-lab/textvqa"
  split: validation
  max_samples: 100
  max_new_tokens: 16
  temperature: 0.0
