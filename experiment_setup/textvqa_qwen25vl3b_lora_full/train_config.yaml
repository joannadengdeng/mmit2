# SSH training config for one experiment setup.
#
# Usage:
#   python -m vlmintune.training --config experiment_setup/textvqa_qwen25vl3b_lora_full/train_config.yaml --host 10.0.0.8

runtime:
  mode: ssh
  ssh:
    port: 22
    username: "root"
    key_path: "~/.ssh/id_rsa"
    # password: ""

model:
  model_path: "Qwen/Qwen2.5-VL-3B-Instruct"

experiment:
  name: "textvqa_qwen25vl3b_lora_full"
  base_dir: "experiments"

training:
  ft_method: lora
  num_epochs: 1
  per_device_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  save_steps: 0
  output_dir: "experiments"
  params:
    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.05
    target_modules: ["q_proj", "v_proj"]

data:
  adapter: hf_datasets
  data_path: "lmms-lab/textvqa"
  split: train
  max_samples: 0
