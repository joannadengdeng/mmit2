# Local eval config for the unfine-tuned base model.
#
# Usage:
#   python -m vlmintune.eval --config experiment_setup/textvqa_qwen25vl3b_lora_debug/base_eval_config.yaml

model:
  name: "qwen25vl_3b_instruct"

experiment:
  name: "textvqa_qwen25vl3b_lora_debug"
  base_dir: "experiments"

eval:
  source: "base"
  dataset_name: "lmms-lab/textvqa"
  max_samples: 20
  max_new_tokens: 16
  temperature: 0.0
