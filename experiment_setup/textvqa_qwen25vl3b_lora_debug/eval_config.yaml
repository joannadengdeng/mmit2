# Local eval config for the trained experiment checkpoint.
#
# Usage:
#   python -m vlmintune.eval --config experiment_setup/textvqa_qwen25vl3b_lora_debug/eval_config.yaml

model:
  model_path: "Qwen/Qwen2.5-VL-3B-Instruct"

experiment:
  name: "textvqa_qwen25vl3b_lora_debug"
  base_dir: "experiments"

eval:
  source: "trained"
  dataset_name: "lmms-lab/textvqa"
  max_samples: 20
  max_new_tokens: 16
  temperature: 0.0
